<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Hello, I'm David / Abbys</title>
  <desc id="desc">An animated greeting alternating between David and Abbys. Welcome to my little corner of GitHub. Blue mountains and a luminous winding river beneath the stars.</desc>
  <defs>
    <linearGradient id="sky" x1="600" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1726"/><stop offset="0.65" stop-color="#254D70"/><stop offset="1" stop-color="#7AB5DA"/></linearGradient>
    <linearGradient id="river" x1="600" y1="230" x2="600" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#77B2D7"/><stop offset="1" stop-color="#D0EEFF"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#83C5EC" stop-opacity="0.2"/><stop offset="1" stop-color="#83C5EC" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="12"/></clipPath>
  </defs>
  <style>
    .alias-david { animation: david 6s ease-in-out infinite; }
    .alias-abbys { opacity: 0; animation: abbys 6s ease-in-out infinite; }
    @keyframes david {
      0%, 40%, 100% { opacity: 1; transform: translateY(0); }
      48% { opacity: 0; transform: translateY(-10px); }
      49%, 92% { opacity: 0; transform: translateY(10px); }
    }
    @keyframes abbys {
      0%, 40% { opacity: 0; transform: translateY(10px); }
      50%, 90% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .alias-david, .alias-abbys { animation: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <path fill="url(#sky)" d="M0 0h1200v400H0z"/>
    <ellipse cx="600" cy="220" rx="510" ry="220" fill="url(#glow)"/>
    <g fill="#C4E4FF" opacity="0.55"><circle cx="91" cy="68" r="1.2"/><circle cx="210" cy="104" r="1"/><circle cx="318" cy="42" r="1.4"/><circle cx="453" cy="67" r="1"/><circle cx="706" cy="42" r="1"/><circle cx="903" cy="77" r="1.3"/><circle cx="1081" cy="43" r="1.4"/><circle cx="1126" cy="138" r="1"/><circle cx="985" cy="166" r="0.8"/><circle cx="138" cy="170" r="0.8"/></g>
    <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
      <g font-size="48" font-weight="600" letter-spacing="-1">
        <text x="620" y="125" text-anchor="end" fill="#E4F3FF">Hello, I'm</text>
        <text x="636" y="125" text-anchor="start" fill="#9ACDEF" class="alias-david">David</text>
        <text x="636" y="125" text-anchor="start" fill="#9ACDEF" class="alias-abbys">Abbys</text>
      </g>
      <text x="600" y="166" fill="#A9CDE7" font-size="19" letter-spacing="0.6">Welcome to my little corner of GitHub</text>
      <text x="600" y="202" fill="#86B8DB" font-family="Consolas, monospace" font-size="21">&lt;/&gt;</text>
    </g>
    <g transform="translate(0 -36) scale(1 1.09)">
    <path d="M0 267C84 253 129 220 209 242S333 275 421 250 531 237 600 248 700 260 781 236 903 220 975 244 1120 229 1200 241V400H0Z" fill="#254D6C"/>
    <path d="M0 291C100 272 142 251 237 272S379 302 470 278 541 251 613 262 704 280 807 255 953 254 1045 272 1142 252 1200 258V400H0Z" fill="#17364F"/>
    <path d="M0 295C75 287 125 309 218 299S345 273 430 291 519 298 591 277C615 270 642 271 665 275 598 286 575 299 636 310S773 340 728 363L660 400H0Z" fill="#0C243B"/>
    <path d="M1200 281C1092 287 1010 317 910 295S768 284 700 280L665 275C631 283 608 288 641 295S733 305 754 323 734 351 704 362L635 400H1200Z" fill="#102B43"/>
    <path d="M665 275C625 282 599 290 627 298S731 314 740 331 692 359 665 372L620 400H508C549 374 610 356 662 342S691 321 642 310 575 293 617 282Z" fill="url(#river)"/>
    <path d="M0 347C106 327 207 330 313 357S437 381 508 400H0Z" fill="#081A2B"/>
    <path d="M1200 334C1064 327 1001 354 884 360S732 382 665 400H1200Z" fill="#081A2B"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="11.5" stroke="#719BBE" stroke-opacity="0.2"/>
</svg>
