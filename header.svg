<svg width="650" height="75" viewBox="0 0 650 75" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="word-clip">
      <rect x="375" y="0" width="275" height="75" />
    </clipPath>
  </defs>

  <style>
    .static-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 700;
      fill: #a371f7;
    }
    .word {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 700;
      fill: #a371f7;
    }
  </style>

  <!-- Static part: Hello! I'm -->
  <text x="145" y="52" class="static-text">Hello! I'm </text>

  <!-- Rotating words inside a clipping area -->
  <g clip-path="url(#word-clip)">
    <!-- Word 1: DavidM -->
    <text x="382" y="52" class="word">
      DavidM
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
        values="1; 1; 0; 0; 0; 1"
        keyTimes="0; 0.44; 0.50; 0.52; 0.94; 1" />
      <animate attributeName="y" dur="5s" repeatCount="indefinite"
        values="52; 52; 15; 90; 90; 52"
        keyTimes="0; 0.44; 0.50; 0.52; 0.94; 1" />
    </text>

    <!-- Word 2: Abbys -->
    <text x="382" y="52" class="word">
      Abbys
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.44; 0.50; 0.94; 0.98; 1" />
      <animate attributeName="y" dur="5s" repeatCount="indefinite"
        values="90; 90; 52; 52; 15; 90"
        keyTimes="0; 0.44; 0.50; 0.94; 0.98; 1" />
    </text>
  </g>
</svg>
